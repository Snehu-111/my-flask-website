
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Welcome back</h1>
            <p>Login to your Student Expense Tracker account.</p>

            {% for message in get_flashed_messages() %}
                <p>{{ message }}</p>
            {% endfor %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label>Username</label>
                <input type="text" name="username" required minlength="3" maxlength="40" autocomplete="username">

                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password">

                <button type="submit">Login</button>
            </form>

            <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
        </section>
    </main>
</body>
</html>
