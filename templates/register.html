{% extends "base.html" %}

{% block title %}Register | Student Finance{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color);">
    <h2 style="color: #fff; margin-top: 0; margin-bottom: 20px;">📝 Create Account</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
        <div>
            <label style="color: var(--text-muted); font-size: 13px; display: block; margin-bottom: 6px;">Choose Username</label>
            <input type="text" name="username" required style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border-color); color: #fff; border-radius: 8px;">
        </div>
        <div>
            <label style="color: var(--text-muted); font-size: 13px; display: block; margin-bottom: 6px;">Password</label>
            <input type="password" name="password" required style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border-color); color: #fff; border-radius: 8px;">
        </div>
        <button type="submit" style="background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px;">Register</button>
    </form>

    <p style="color: var(--text-muted); font-size: 14px; margin-top: 20px; text-align: center;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent); text-decoration: none; font-weight: 600;">Login here</a>
    </p>
</div>
{% endblock %}
