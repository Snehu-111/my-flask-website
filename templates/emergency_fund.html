{% extends 'base.html' %}

{% block title %}Emergency Fund - Student Finance{% endblock %}
{% block heading %}Emergency Fund / Pocket Money Tracker{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; gap: 24px; max-width: 900px;">
    
    <!-- Balance Card -->
    <div style="background: #131b31; border: 1px solid #1f2a48; border-radius: 12px; padding: 24px;">
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 6px;">Current Emergency Savings</p>
        <h1 style="color: #10b981; margin: 0; font-size: 36px;">₹{{ balance }}</h1>
    </div>

    <!-- Deposit / Withdraw Form -->
    <div style="background: #131b31; border: 1px solid #1f2a48; border-radius: 12px; padding: 24px;">
        <h3 style="color: #fff; margin-bottom: 16px;">Manage Emergency Fund</h3>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div>
                    <label style="color: #94a3b8; font-size: 14px; display: block; margin-bottom: 6px;">Action Type</label>
                    <select name="action" style="width: 100%; padding: 10px; background: #0b1020; border: 1px solid #2a365f; color: #fff; border-radius: 8px;">
                        <option value="deposit">Deposit (jama karne)</option>
                        <option value="withdraw">Withdraw (kadane)</option>
                    </select>
                </div>
                <div>
                    <label style="color: #94a3b8; font-size: 14px; display: block; margin-bottom: 6px;">Amount (₹)</label>
                    <input type="number" step="0.01" name="amount" placeholder="500" required style="width: 100%; padding: 10px; background: #0b1020; border: 1px solid #2a365f; color: #fff; border-radius: 8px;">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button type="submit" style="width: 100%; background: #6366f1; color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: 600; cursor: pointer;">Update Fund</button>
                </div>
            </div>
        </form>
    </div>

</div>
{% endblock %}
